<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17213b">
<title>Focus Study | CTET Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17213b;--muted:#6c7590;--paper:#eef2f7;--surface:#fff;--line:#d8deea;--blue:#1d3fdc;--yellow:#d7f05b;--coral:#ff6b4a;--shadow:0 20px 50px rgba(32,48,90,.12)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'DM Sans',sans-serif;background-color:var(--paper);background-image:linear-gradient(rgba(29,63,220,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(29,63,220,.045) 1px,transparent 1px);background-size:34px 34px}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:35px;font:700 21px 'Space Grotesk',sans-serif}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:9px;color:var(--ink);background:var(--yellow);box-shadow:5px 5px 0 var(--coral)}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}h1{margin:0;font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.06em}.sub{color:var(--muted);line-height:1.6}
.primary{padding:13px 18px;border:2px solid var(--ink);border-radius:3px;color:var(--ink);background:var(--yellow);box-shadow:4px 4px 0 var(--coral);font-weight:700}.primary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--coral)}
.status{min-height:20px;margin:12px 0 0;color:#b54835;font-size:12px}.status.success{color:#23734e}
.app{width:min(980px,100%);margin:0 auto;padding:30px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:70px}.top .brand{margin:0}
.hero{text-align:center;margin:0 auto 35px}.eyebrow{margin:0 0 13px;color:var(--coral);font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}.hero h1{max-width:720px;margin:auto}.hero .sub{max-width:500px;margin:17px auto 0;font-size:14px}
.search-card{width:min(700px,100%);margin:0 auto;padding:25px;border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:9px;background:var(--surface);box-shadow:var(--shadow)}
.search-title{display:flex;align-items:center;gap:12px;margin-bottom:17px}.yt-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:8px;color:#fff;background:#e62117;font-size:19px}.search-title h2{margin:0;font-size:20px}.search-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
.search-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.search-form input{min-width:0;padding:14px;border:1px solid var(--line);border-radius:5px;outline:none;background:#f8faff}.search-form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1d3fdc1c}
.api-settings{margin-top:18px;padding-top:13px;border-top:1px solid var(--line)}.api-settings summary{cursor:pointer;color:var(--blue);font-size:12px;font-weight:700}.api-settings .search-form{margin-top:10px}.api-settings .helper{margin-top:8px}.helper{margin:12px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
.results{display:grid;gap:12px;margin:24px auto 0;width:min(850px,100%)}.result{display:grid;grid-template-columns:180px minmax(0,1fr) auto;align-items:center;gap:15px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}.result img{width:180px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;background:#e6eaf2}.result h3{margin:0 0 6px;font-size:14px;line-height:1.4}.result p{margin:0;color:var(--muted);font-size:11px}.watch{padding:10px 13px;border:0;border-radius:5px;color:#fff;background:var(--blue);font-size:12px;font-weight:700}.watch:hover{background:var(--ink)}
.empty{padding:25px;border:1px dashed #aab5cc;border-radius:8px;color:var(--muted);text-align:center;background:#ffffffa8}
.player-wrap{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#10182bdc}.player{width:min(900px,100%);padding:14px;border-radius:10px;background:#fff;box-shadow:0 25px 90px #0006}.player-head{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:3px 3px 13px}.player-head h2{margin:0;font-size:16px}.close{border:0;background:transparent;color:var(--muted);font-size:25px}.video{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#111}
footer{margin:40px auto 0;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:620px){.app{padding:20px 15px 40px}.top{margin-bottom:55px}.hero{margin-bottom:25px}.search-card{padding:18px}.search-form{grid-template-columns:1fr}.search-form .primary{width:100%}.result{grid-template-columns:92px minmax(0,1fr);gap:10px}.result img{width:92px}.result .watch{grid-column:2;justify-self:start;padding:8px 10px}.result h3{font-size:12px}.top .brand{font-size:18px}}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{width:min(900px,100%);padding:34px 22px 60px}
.top{margin-bottom:34px}
.search-card{width:min(760px,100%);padding:clamp(20px,4vw,34px);border:1px solid #e1e7f2;border-top:0;border-radius:20px;background:linear-gradient(145deg,#fff 0%,#fbfcff 100%);box-shadow:0 18px 55px rgba(30,48,94,.10)}
.search-title{gap:14px;margin-bottom:24px}
.yt-mark{width:48px;height:48px;border-radius:14px;box-shadow:0 7px 16px rgba(230,33,23,.18)}
.search-title h2{font-size:clamp(21px,3vw,26px);letter-spacing:-.04em}
.search-title p{font-size:13px}
.search-form{grid-template-columns:minmax(0,1fr) auto;gap:12px}
.search-form input{min-height:54px;padding:0 18px;border:1px solid #dfe5f0;border-radius:12px;background:#f7f9fd;font-size:14px;transition:border-color .2s,box-shadow .2s,background .2s}
.search-form input:focus{border-color:#6178ed;background:#fff;box-shadow:0 0 0 4px rgba(29,63,220,.10)}
.primary{min-height:54px;padding:0 22px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,#294ce5,#1736c6);box-shadow:0 7px 15px rgba(29,63,220,.20);transition:transform .2s,box-shadow .2s}
.primary:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(29,63,220,.25)}
#searchButton{display:flex;align-items:center;justify-content:center;gap:10px}
#searchButton span:last-child{font-size:20px;line-height:1}
.topic-area{margin-top:23px}
.topic-label{display:block;margin-bottom:10px;color:#818aa1;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.topic-chips{display:flex;flex-wrap:wrap;gap:8px}
.topic-chip{padding:9px 13px;border:1px solid #e1e6f0;border-radius:999px;color:#45516e;background:#fff;font-size:12px;font-weight:600;transition:all .18s}
.topic-chip:hover,.topic-chip:focus-visible{border-color:#9eafff;color:#2343d4;background:#f2f5ff}
.api-settings{margin-top:25px;padding-top:18px;border-top:1px solid #edf0f6}
.api-settings summary{display:flex;align-items:center;gap:8px;list-style:none;color:#52607c;font-size:12px;font-weight:700}
.api-settings summary::-webkit-details-marker{display:none}
.api-settings summary:after{content:"＋";margin-left:auto;color:#526fe5;font-size:17px}
.api-settings[open] summary:after{content:"−"}
.settings-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#f0f3ff;color:#3855d7;font-size:14px}
.saved-indicator{margin-left:auto;padding:4px 8px;border-radius:999px;color:#9a6a20;background:#fff5df;font-size:10px}
.saved-indicator.is-saved{color:#24724d;background:#e8f7ef}
.api-settings .helper{margin:12px 0;color:#7a849b;font-size:12px}
.api-form{margin-top:10px}
.api-form input{min-height:46px;font-size:13px}
.api-form .primary{min-height:46px;padding:0 17px;font-size:12px}
.key-actions{display:flex;gap:16px;margin-top:10px}
.text-button{padding:3px 0;border:0;color:#425bd0;background:transparent;font-size:11px;font-weight:700}
.text-button.danger{color:#b65353}
.status{font-size:12px}
.search-status:empty{display:none}
.results{width:min(850px,100%);margin-top:24px}
.result{border-color:#e5e9f2;border-radius:13px;box-shadow:0 5px 18px rgba(32,48,90,.045)}
.watch{border-radius:8px}
footer{margin-top:35px}
@media(max-width:620px){
 .app{padding:22px 14px 38px}
 .top{margin-bottom:25px}
 .brand{font-size:19px}
 .search-card{padding:20px 16px;border-radius:17px}
 .search-form{grid-template-columns:1fr}
 #searchButton{width:100%}
 .topic-chips{gap:7px}
 .topic-chip{padding:8px 11px;font-size:11px}
 .api-form{grid-template-columns:1fr}
 .api-form .primary{width:100%}
 .result{border-radius:11px}
}


.top-tools{width:min(760px,100%);margin:-12px auto 22px}
.top-tools .api-settings{margin:0;padding:12px 16px;border:1px solid #e3e8f2;border-radius:13px;background:#fff;box-shadow:0 5px 18px rgba(32,48,90,.05)}
.top-tools .search-status{margin:7px 4px 0}
.search-card .api-settings,.search-card .search-status{display:none}
.results{display:grid;grid-template-columns:1fr;gap:20px;width:min(760px,100%);margin:24px auto 0}
.result{display:block;overflow:hidden;padding:0;border:1px solid #e3e8f2;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(32,48,90,.07);cursor:pointer;transition:transform .18s,box-shadow .18s}
.result:hover,.result:focus-visible{transform:translateY(-2px);box-shadow:0 13px 30px rgba(32,48,90,.12);outline:2px solid #aab8ff;outline-offset:2px}
.thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#e9edf5}
.thumb-wrap img{display:block;width:100%;height:100%;object-fit:cover}
.play-overlay{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:62px;height:44px;border-radius:13px;color:#fff;background:#e62117;box-shadow:0 5px 16px #0004;font-size:21px;transform:translate(-50%,-50%);opacity:.95}
.result:hover .play-overlay{background:#c91610;transform:translate(-50%,-50%) scale(1.06)}
.video-info{padding:15px 17px 17px}
.video-title{margin:0 0 7px;color:#17213b;font:700 17px/1.4 'DM Sans',sans-serif}
.channel-name{margin:0;color:#69748c;font-size:13px}
.video-description{margin:9px 0 0;color:#7b8499;font-size:12px;line-height:1.5}
@media(min-width:700px){
 .results{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
}
@media(max-width:620px){
 .top-tools{margin:-5px auto 17px}
 .top-tools .api-settings{padding:10px 12px}
 .results{gap:15px}
 .video-info{padding:12px 14px 15px}
 .video-title{font-size:15px}
 .channel-name{font-size:12px}
 .play-overlay{width:56px;height:40px}
}

.player-actions{display:flex;align-items:center;gap:12px}.fullscreen-btn{padding:9px 12px;border:0;border-radius:7px;color:#fff;background:#294ce5;font-size:12px;font-weight:700}.player-wrap.is-fullscreen{padding:0;background:#000}.player-wrap.is-fullscreen .player{width:100%;height:100%;max-width:none;padding:0;border-radius:0;display:flex;flex-direction:column;background:#000}.player-wrap.is-fullscreen .player-head{flex:0 0 auto;min-height:58px;padding:12px 18px;color:#fff;background:#10182b}.player-wrap.is-fullscreen .player-head h2{color:#fff;font-size:16px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}.player-wrap.is-fullscreen .player-actions{flex-shrink:0}.player-wrap.is-fullscreen .fullscreen-btn{display:none!important}.player-wrap.is-fullscreen .close{color:#fff;font-size:28px}.player-wrap.is-fullscreen .video{flex:1 1 auto;min-height:0;width:100%;height:100%;max-height:none;aspect-ratio:auto;border-radius:0}@media(max-width:620px){.player-actions{gap:8px}.fullscreen-btn{padding:8px 10px}}
/* Hide video title bar and cross button */
.player-head {
    display: none !important;
}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark">✦</span><span>Focus Study</span></div>
  </header>
  <div class="top-tools">
    <details class="api-settings">
      <summary><span class="settings-icon" aria-hidden="true">⚙</span> YouTube API key <span class="saved-indicator" id="keySavedIndicator">Not set</span></summary>
      <p class="helper">Your key is saved in this browser's local storage on this device. It is not uploaded to GitHub or a cloud account by this page.</p>
      <form class="search-form api-form" id="apiKeyForm">
        <label class="sr-only" for="apiKeyInput">YouTube Data API key</label>
        <input id="apiKeyInput" type="password" placeholder="Paste your YouTube Data API key" autocomplete="off">
        <button class="primary" type="submit">Save key</button>
      </form>
      <div class="key-actions">
        <button class="text-button" id="toggleKey" type="button">Show key</button>
        <button class="text-button danger" id="clearKey" type="button">Remove saved key</button>
      </div>
      <p class="status" id="apiKeyStatus" aria-live="polite"></p>
    </details>
    <p class="status search-status" id="searchStatus" aria-live="polite"></p>
  </div>

  
  <section class="search-card" aria-labelledby="searchHeading">
    <div class="search-title">
      <span class="yt-mark" aria-hidden="true">▶</span>
      <div>
        <h2 id="searchHeading">Find a CTET lecture</h2>
        <p>Search by subject, chapter or topic</p>
      </div>
    </div>
    <form class="search-form" id="searchForm">
      <label class="sr-only" for="query">Search CTET topics</label>
      <input id="query" type="search" placeholder="Try “Child Development and Pedagogy”" autocomplete="off" required>
      <button class="primary" id="searchButton" type="submit"><span>Search</span><span aria-hidden="true">⌕</span></button>
    </form>
    <div class="topic-area">
      <span class="topic-label">Popular topics</span>
      <div class="topic-chips" aria-label="Popular CTET topics">
        <button class="topic-chip" type="button" data-topic="Child Development and Pedagogy">Child Development</button>
        <button class="topic-chip" type="button" data-topic="CTET Mathematics">Mathematics</button>
        <button class="topic-chip" type="button" data-topic="CTET Environmental Studies EVS">EVS</button>
        <button class="topic-chip" type="button" data-topic="CTET English Language Pedagogy">Language</button>
      </div>
    </div>
</section>
<section class="results" id="results" aria-live="polite"></section>
  <footer>Focus Study · CTET learning space</footer>
</main>

<div class="player-wrap hidden" id="playerWrap" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
  <div class="player">
    <div class="player-head"><h2 id="playerTitle">CTET lesson</h2><div class="player-actions"><button class="fullscreen-btn" id="fullscreenPlayer" type="button">⛶ Fullscreen</button><button class="close" id="closePlayer" aria-label="Stop video and close player">×</button></div></div>
    <iframe class="video" id="video" title="CTET lesson video" sandbox="allow-scripts allow-same-origin allow-presentation" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
</div>

<script>
(() => {
  const $ = selector => document.querySelector(selector);
  let apiKey = localStorage.getItem('focusstudy_ctet_youtube_api_key') || '';
  if (apiKey) $('#apiKeyInput').value = apiKey;
  const keySavedIndicator = $('#keySavedIndicator');
  function updateKeyIndicator(){
    keySavedIndicator.textContent = apiKey ? 'Saved in this browser' : 'Not set';
    keySavedIndicator.classList.toggle('is-saved', Boolean(apiKey));
  }
  updateKeyIndicator();

  document.querySelectorAll('[data-topic]').forEach(chip => {
    chip.addEventListener('click', () => {
      $('#query').value = chip.dataset.topic;
      $('#query').focus();
    });
  });

  $('#toggleKey').addEventListener('click', () => {
    const field = $('#apiKeyInput');
    field.type = field.type === 'password' ? 'text' : 'password';
    $('#toggleKey').textContent = field.type === 'password' ? 'Show key' : 'Hide key';
  });
  $('#clearKey').addEventListener('click', () => {
    apiKey = '';
    localStorage.removeItem('focusstudy_ctet_youtube_api_key');
    $('#apiKeyInput').value = '';
    updateKeyIndicator();
    setStatus($('#apiKeyStatus'), 'Saved API key removed from this browser.');
  });

  function setStatus(el, message, error=false){
    el.textContent = message;
    el.className = error ? 'status' : 'status success';
  }

  $('#apiKeyForm').addEventListener('submit', event => {
    event.preventDefault();
    apiKey = $('#apiKeyInput').value.trim();
    if (!apiKey) {
      localStorage.removeItem('focusstudy_ctet_youtube_api_key');
      updateKeyIndicator();
      setStatus($('#apiKeyStatus'), 'API key cleared.');
      return;
    }
    localStorage.setItem('focusstudy_ctet_youtube_api_key', apiKey);
    updateKeyIndicator();
    setStatus($('#apiKeyStatus'), 'API key saved in this browser on this device.');
  });

  function escapeHTML(value){
    return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  }
  function isShort(item){
    const title=(item.snippet?.title||'').toLowerCase();
    const duration=item.contentDetails?.duration||'';
    return /\b(shorts?|#shorts)\b/.test(title) || (duration && /^PT(?:[0-5]?[0-9])S$/.test(duration));
  }
  function durationToSeconds(iso){
    const match=String(iso).match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);
    if(!match)return 0;
    return (Number(match[1]||0)*3600)+(Number(match[2]||0)*60)+Number(match[3]||0);
  }
  async function searchCTET(query){
    if(!apiKey) throw new Error('Please open “YouTube API key settings” and add your YouTube Data API key.');
    const params=new URLSearchParams({
      part:'snippet', type:'video', videoCategoryId:'27', videoDuration:'medium',
      maxResults:'50', order:'relevance', q:`CTET ${query}`, key:apiKey
    });
    const response=await fetch(`https://www.googleapis.com/youtube/v3/search?${params}`);
    const data=await response.json();
    if(!response.ok) throw new Error(data.error?.message || 'YouTube search failed.');
    const ids=(data.items||[]).map(item=>item.id?.videoId).filter(Boolean);
    if(!ids.length)return [];
    const detailParams=new URLSearchParams({part:'contentDetails,snippet',id:ids.join(','),key:apiKey});
    const detailResponse=await fetch(`https://www.googleapis.com/youtube/v3/videos?${detailParams}`);
    const detailData=await detailResponse.json();
    if(!detailResponse.ok) throw new Error(detailData.error?.message || 'Could not verify video lengths.');
    const ctetTerms=/ctet|child development|pedagogy|teaching aptitude|language pedagogy|environmental studies|evs|mathematics pedagogy|social studies|classroom/i;
    return (detailData.items||[])
      .filter(item=>!isShort(item) && ctetTerms.test(`${item.snippet?.title||''} ${item.snippet?.description||''}`))
      .map(item=>({id:item.id,snippet:item.snippet,durationSeconds:durationToSeconds(item.contentDetails?.duration||'')}));
  }
  function renderResults(items){
    if(!items.length){
      $('#results').innerHTML='<div class="empty">No suitable CTET lecture found. Try a specific topic such as “CTET pedagogy” or “Child Development”.</div>';
      return;
    }
    $('#results').innerHTML=items.map(item=>{
      const title=escapeHTML(item.snippet.title);
      const channel=escapeHTML(item.snippet.channelTitle);
      const thumbs=item.snippet.thumbnails || {};
      const thumb=(thumbs.maxres || thumbs.standard || thumbs.high || thumbs.medium || thumbs.default || {}).url || '';
      const description=escapeHTML((item.snippet.description || '').replace(/\\s+/g,' ').slice(0,150));
      return `<article class="result" data-video="${item.id}" data-title="${title}" role="button" tabindex="0" aria-label="Play ${title}">
        <div class="thumb-wrap"><img src="${thumb}" alt="Video thumbnail: ${title}" loading="lazy"><span class="play-overlay" aria-
